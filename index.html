<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff; --ink:#0d0d0d; --muted:#8a8a8a; --line:rgba(0,0,0,.1); --pill:#ececec; --accent:#ff3b1f;
  --s:1;
}
@media (max-width:700px){:root{--s:.72}}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter Tight','Noto Sans TC',system-ui,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-font-smoothing:antialiased}

/* ── magazine chrome ── */
.mast{position:fixed;left:48px;right:48px;top:28px;display:flex;justify-content:space-between;align-items:center;
  font-size:11px;letter-spacing:.02em;z-index:20;pointer-events:none}
.mast .brand{font-weight:600}
.mast .brand span{color:var(--muted);font-weight:400;margin-left:10px}
.pills{display:flex;gap:6px;pointer-events:auto}
.pills button{border:0;background:var(--pill);color:var(--ink);font:500 11px 'Inter Tight','Noto Sans TC',sans-serif;
  padding:7px 12px 7px 10px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .2s}
.pills button::before{content:"";width:5px;height:5px;border-radius:50%;background:#b5b5b5;transition:background .2s}
.pills button.on::before{background:var(--accent)}
.pills button:hover{background:#e2e2e2}

.preview{position:fixed;left:48px;top:20vh;width:170px;z-index:5;pointer-events:none}
.preview .img{width:170px;aspect-ratio:3/2;border-radius:2px;overflow:hidden;position:relative;background:#eee;transition:background .3s}
.preview .img .cover{position:absolute;inset:0;padding:10px}
.preview .cap{font-size:12px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview .cap small{color:var(--muted);margin-left:6px}

.big{position:fixed;left:44px;bottom:12vh;font-weight:500;font-size:clamp(64px,10.5vw,150px);line-height:.85;
  letter-spacing:-.045em;z-index:3;pointer-events:none}
.foot{position:fixed;right:48px;bottom:12vh;font-size:11px;text-align:right;line-height:1.6;z-index:3;pointer-events:none}
.foot b{font-weight:600}
.foot span{color:var(--muted)}
.side{position:fixed;right:48px;top:50%;width:8px;height:8px;border-radius:50%;background:var(--ink);z-index:3}
.rule{position:fixed;left:48px;right:48px;bottom:7vh;height:1px;background:var(--line);z-index:3}
.meta{position:fixed;left:48px;right:48px;bottom:calc(7vh - 22px);display:flex;justify-content:space-between;
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);z-index:3;pointer-events:none}

/* ── stage ── */
#stage{position:fixed;inset:0;cursor:grab}
#stage.dragging{cursor:grabbing}
.view{position:absolute;inset:0;transition:opacity .6s, visibility .6s}
.view.off{opacity:0;visibility:hidden}

/* ── book (3D box) ── */
.book{position:relative;transform-style:preserve-3d;cursor:pointer}
.face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden}
.spine{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0 12px;
  box-shadow:inset 2px 0 4px -2px rgba(0,0,0,.3)}
.spine .t{writing-mode:vertical-rl;font-family:'Noto Sans TC','Inter Tight',sans-serif;font-weight:700;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;line-height:1}
.spine .a{writing-mode:vertical-rl;font-size:9px;letter-spacing:.06em;opacity:.7;white-space:nowrap;max-height:35%;overflow:hidden}
.spine .mark{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8;margin-bottom:10px}
.cover{display:flex;flex-direction:column;justify-content:space-between;padding:12px}
.cover .art{position:absolute;inset:0}
.cover .ct{position:relative;font-family:'Noto Sans TC','Inter Tight',sans-serif;font-weight:900;line-height:1.1;letter-spacing:-.01em}
.cover .ca{position:relative;font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.top{position:absolute;left:0;top:0;background:#f4f1ea;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px)}

/* ── shelf view ── */
#shelf .track{position:absolute;left:0;bottom:calc(46% - 150px*var(--s));display:flex;align-items:flex-end;
  will-change:transform;perspective:1400px}
#shelf .slot{flex:none;display:flex;justify-content:center;align-items:flex-end;padding:0 calc(2px*var(--s));
  transition:width .7s cubic-bezier(.6,0,.2,1), transform .35s cubic-bezier(.3,1.4,.5,1)}
#shelf .slot.sel .book, #shelf .slot.leaving .book{transition:transform .7s cubic-bezier(.6,0,.2,1)}
#shelf .slot.hover:not(.sel){transform:translateY(-16px)}

/* ── ring view ── */
#ring{perspective:1900px;perspective-origin:50% 25%}
#ring .carousel{position:absolute;left:50%;top:52%;transform-style:preserve-3d;will-change:transform}
#ring .book{position:absolute;left:0;top:0;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}

/* ── detail panel ── */
#detail{position:fixed;right:0;top:0;bottom:0;width:min(400px,92vw);background:var(--bg);z-index:30;
  padding:80px 40px 40px;overflow:auto;transform:translateX(105%);transition:transform .6s cubic-bezier(.6,0,.2,1);
  border-left:1px solid var(--line);-webkit-user-select:text;user-select:text;touch-action:auto}
#detail.open{transform:none}
#detail .x{position:absolute;right:28px;top:24px;border:0;background:var(--pill);color:var(--ink);
  padding:7px 12px;border-radius:7px;font:500 11px 'Inter Tight',sans-serif;cursor:pointer}
#detail .no{font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:22px;display:flex;justify-content:space-between}
#detail h2{font-family:'Noto Sans TC','Inter Tight',sans-serif;font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-.02em;margin-bottom:10px}
#detail .by{font-size:13px;margin-bottom:22px}
#detail .by span{color:var(--muted)}
#detail .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
#detail .tag{font-size:11px;background:var(--pill);border-radius:6px;padding:5px 9px;display:flex;gap:6px;align-items:center}
#detail .tag.st::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
#detail .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
#detail p{font-size:14px;line-height:1.8}
#detail blockquote{font-size:19px;font-weight:500;line-height:1.5;letter-spacing:-.01em;margin-bottom:14px}
#detail blockquote::before{content:"“";color:var(--accent)}
#detail .metarow{display:grid;grid-template-columns:70px 1fr;font-size:12px;line-height:2}
#detail .metarow dt{color:var(--muted)}

@media (max-width:700px){
  .mast,.rule,.meta{left:16px;right:16px}
  .mast{top:16px}.mast .brand span{display:none}
  .preview{left:16px;top:70px;width:110px}.preview .img{width:110px}
  .big{left:14px;bottom:13vh}.foot{right:16px;bottom:13vh}.side{display:none}
  #detail{top:auto;width:100%;max-height:58vh;padding:60px 20px 28px;transform:translateY(105%);border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="mast">
  <div class="brand">Book Carousel<span>個人選書 — Vol. 01</span></div>
  <div class="pills">
    <button data-mode="ring" class="on">Ring 書環</button>
    <button data-mode="shelf">Shelf 書架</button>
  </div>
</div>

<div class="preview"><div class="img" id="pvImg"></div><div class="cap" id="pvCap"></div></div>

<div id="stage">
  <div class="view" id="ring"><div class="carousel"></div></div>
  <div class="view off" id="shelf"><div class="track"></div></div>
</div>

<div class="big" id="big">Ring</div>
<div class="foot"><b id="count"></b><br><span id="hint">拖曳或滾動旋轉 · 點書看詳情</span></div>
<div class="rule"></div>
<div class="meta"><span>The Personal Library</span><span id="date"></span></div>

<aside id="detail" aria-live="polite"><button class="x">Close ✕</button><div id="dbody"></div></aside>

<script src="books.js"></script>
<script>
/* ───────────── data ───────────── */
const books = ((window.BOOKS && window.BOOKS.length) ? window.BOOKS : [{title:'範例書',author:'作者'}])
  .map((b,i)=>({...b,_i:i}));
const S = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s'))||1;

function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rnd(seed,n){return ((hash(seed+'#'+n)%10000)/10000)}

/* editorial palette: [base, ink, accent] */
const PALETTE = [
  ['#f2f0ec','#111','#ff3b1f'],['#e9e7e1','#111','#2f5d3a'],['#1a1a1a','#f2f0ec','#ff3b1f'],['#c9261a','#fff','#f2b8a8'],
  ['#dcdcd6','#111','#7a7a72'],['#6f1d1b','#f3e3c9','#d8a48f'],['#a8b59a','#111','#f2f0ec'],['#ff3b1f','#fff','#ffd2c4'],
  ['#efe9dc','#111','#c08a2b'],['#2c3e2f','#eae6dc','#9fb38a'],['#bfc4c9','#111','#ffffff'],['#f6d7c8','#3a1410','#ff3b1f'],
  ['#3b3b3b','#f2f0ec','#a3a3a3'],['#e4dccb','#111','#6f1d1b']
];
function look(b){
  const key = (b.id||'')+b.title;
  const [bg,fg,ac] = PALETTE[hash(key)%PALETTE.length];
  const h = Math.round(200 + rnd(key,1)*70);
  const w = Math.round(22 + rnd(key,2)*24);
  const d = Math.round(h*(0.68+rnd(key,3)*0.1));
  const art = hash(key+'art')%5;
  const lean = rnd(key,4)<.15 ? (rnd(key,5)<.5?-1:1)*(4+rnd(key,6)*5) : 0;
  if(b.cover){ // real book: keep its true proportions (spine & cover images)
    const H=255, ar=b.coverRatio||0.75, sr=b.spineRatio||0.07;
    return {bg:b.color||'#1d2b44',fg:'#fff',ac:'#fff',h:H,w:Math.round(H*sr),d:Math.round(H*ar),art,lean:0,key,img:true};
  }
  return {bg,fg,ac,h,w,d,art,lean,key};
}
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* abstract editorial cover art */
function artCSS(L){
  const a=L.ac, f=L.fg, r=n=>Math.round(rnd(L.key,n)*100);
  switch(L.art){
    case 0: return `radial-gradient(circle at ${r(7)}% ${30+r(8)/2}%, ${a} 0 18%, transparent 40%), radial-gradient(circle at ${r(9)}% ${r(10)}%, rgba(255,255,255,.7) 0 12%, transparent 35%)`;
    case 1: return `linear-gradient(${r(11)*3.6}deg, transparent 40%, ${a} 40% 58%, transparent 58%)`;
    case 2: return `radial-gradient(ellipse at 50% 120%, ${a} 0 35%, transparent 62%), linear-gradient(transparent 70%, rgba(0,0,0,.08))`;
    case 3: return `repeating-linear-gradient(90deg, ${f}22 0 1px, transparent 1px 9px), radial-gradient(circle at ${30+r(12)/2}% 55%, ${a} 0 22%, transparent 23%)`;
    default:return `conic-gradient(from ${r(13)*3.6}deg at 60% 55%, ${a}, transparent 25%, ${a}88 50%, transparent 75%)`;
  }
}
const url = u => `url('${encodeURI(String(u)).replace(/'/g,'%27')}')`;
function coverInner(b,L,size,fit='cover'){
  if(b.cover) return `<div class="art" style="background:${url(b.cover)} center/${fit} no-repeat"></div>`;
  return `<div class="art" style="background:${artCSS(L)}"></div>
    <div class="ca">${esc(b.author||'')}</div>
    <div class="ct" style="font-size:${size}px">${esc(b.title)}</div>`;
}

/* 3D book. Spine faces +Z; front cover is the left side (-X). */
function bookEl(b, L, scale=S()){
  const h=L.h*scale, w=L.w*scale, d=L.d*scale;
  const el = document.createElement('div');
  el.className='book';
  el.style.cssText=`width:${w}px;height:${h}px;color:${L.fg}`;
  const fs = Math.max(8, Math.min(w*.5, 16));
  el.innerHTML = `
    ${b.spine ? `<div class="face spine" style="background:${L.bg} ${url(b.spine)} center/100% 100%;transform:translateZ(${d/2}px)"></div>` :
    `<div class="face spine" style="background:${L.bg};transform:translateZ(${d/2}px)">
      <div class="mark" style="color:${L.ac}"></div>
      <div class="t" style="font-size:${fs}px">${w>14?esc(b.title):''}</div>
      <div class="a">${w>20?esc(b.author||''):''}</div>
    </div>`}
    <div class="face" style="background:${L.bg};filter:brightness(.85);transform:rotateY(180deg) translateZ(${d/2}px)"></div>
    <div class="face cover" style="background:${L.bg};width:${d}px;left:${(w-d)/2}px;transform:rotateY(-90deg) translateZ(${w/2}px)">
      ${coverInner(b,L,Math.max(10,Math.min(22,d/7)))}</div>
    <div class="face cover" style="background:${L.bg};width:${d}px;left:${(w-d)/2}px;transform:rotateY(90deg) translateZ(${w/2}px)">
      <div class="art" style="background:${b.cover?L.bg:artCSS(L)};transform:scaleX(-1);filter:brightness(.92)"></div></div>
    <div class="top" style="width:${w}px;height:${d}px;top:${-d/2}px;transform:rotateX(90deg)"></div>`;
  el.dataset.i=b._i;
  return {el,w,h,d};
}

/* ───────────── preview + detail ───────────── */
const pvImg=document.getElementById('pvImg'), pvCap=document.getElementById('pvCap');
let pvCur=-1;
function preview(b){
  if(!b || pvCur===b._i) return; pvCur=b._i;
  const L=look(b);
  pvImg.style.background=L.bg; pvImg.style.color=L.fg;
  pvImg.innerHTML=`<div class="cover">${coverInner(b,L,15,'contain')}</div>`;
  pvCap.innerHTML=`${esc(b.title)}<small>${esc(b.author||'')}</small>`;
}
const STATUS = {done:'已完成',reading:'閱讀中',want:'想讀',paused:'暫停'};
const detail = document.getElementById('detail');
function showDetail(b){
  const quotes=(b.quote||'').split('\n').map(q=>q.trim()).filter(Boolean);
  const meta=[['出版',b.publisher],['語言',b.lang],['開始',b.start],['完讀',b.end],['推薦',b.recommender]].filter(m=>m[1]);
  document.getElementById('dbody').innerHTML=`
    <div class="no"><span>No. ${String(b._i+1).padStart(2,'0')}</span><span>${esc(b.cat||'')}</span></div>
    <h2>${esc(b.title)}</h2><div class="by"><span>by</span> ${esc(b.author||'—')}</div>
    <div class="tags">${b.status?`<span class="tag st">${STATUS[b.status]||esc(b.status)}</span>`:''}
      ${b.stars?`<span class="tag">${'★'.repeat(b.stars)}${'☆'.repeat(5-b.stars)}</span>`:''}</div>
    ${quotes.length?`<div class="lbl">Quote · 名言摘錄</div>${quotes.map(q=>`<blockquote>${esc(q)}</blockquote>`).join('')}`:''}
    ${b.note?`<div class="lbl">Notes · 我的心得</div><p>${esc(b.note)}</p>`:''}
    ${meta.length?`<div class="lbl">Info</div><dl class="metarow">${meta.map(m=>`<dt>${m[0]}</dt><dd>${esc(m[1])}</dd>`).join('')}</dl>`:''}`;
  detail.classList.add('open');
  preview(b);
}
function hideDetail(){ detail.classList.remove('open'); }
detail.querySelector('.x').onclick=()=>{ hideDetail(); deselect(); };
document.getElementById('count').textContent = `${books.length} Books`;
document.getElementById('date').textContent = new Date().toLocaleDateString('en-GB',{month:'long',year:'numeric'});

/* ───────────── shelf view ───────────── */
const track = document.querySelector('#shelf .track');
let slots=[], setWidth=0;
function buildShelf(){
  track.innerHTML=''; slots=[];
  const s=S(), items = books.map(b=>({b,L:look(b)}));
  const one = items.reduce((t,it)=>t+it.L.w*s+4*s,0);
  const copies = Math.max(3, Math.ceil(innerWidth*2/one)+2);
  for(let c=0;c<copies;c++) items.forEach(({b,L})=>{
    const {el,w,d} = bookEl(b,L);
    const slot=document.createElement('div');
    slot.className='slot';
    const base = w+4*s;
    slot.style.width=base+'px';
    el.style.transform=`rotateZ(${L.lean}deg)`;
    el.style.transformOrigin = L.lean<0?'0% 100%':'100% 100%';
    slot.appendChild(el); track.appendChild(slot);
    slots.push({slot,el,b,base,open:d+28,lean:L.lean});
  });
  setWidth = one;
}
let x=0, tx=0, vel=0, selected=null;
function deselect(){
  if(!selected) return;
  const s=selected; selected=null;
  s.slot.classList.remove('sel'); s.slot.classList.add('leaving'); s.slot.style.width=s.base+'px';
  setTimeout(()=>s.slot.classList.remove('leaving'),750);
  s.el.style.transform=`rotateZ(${s.lean}deg)`;
}
function selectSlot(s){
  if(selected===s){ deselect(); hideDetail(); return; }
  deselect(); selected=s;
  s.slot.classList.add('sel'); s.slot.style.width=s.open+'px';
  s.el.style.transform=`translateY(-10px) rotateY(90deg)`;
  const r=s.slot.getBoundingClientRect();
  const centre = innerWidth>700 ? (innerWidth-400)/2 : innerWidth/2;
  tx += centre-(r.left+s.open/2);
  showDetail(s.b);
}

/* ───────────── ring view ───────────── */
const carousel=document.querySelector('#ring .carousel');
let ringItems=[], ringR=0, rot=0, trot=0;
function buildRing(){
  carousel.innerHTML=''; ringItems=[];
  const n = Math.max(120, books.length);
  ringR = Math.min(innerWidth*(innerWidth<700?0.4:0.3), 380);
  const sc = Math.min(1, ringR/380)*0.5;
  for(let i=0;i<n;i++){
    const b=books[i%books.length]; const L0=look(b);
    // thin, card-like volumes so the covers read as a fan of pages
    const L={...L0,h:L0.h*sc,w:3.5,d:L0.d*sc*1.05};
    const {el,w,h}=bookEl(b,L,1);
    const a = i/n*360;
    const base=`translate(${-w/2}px,${-h}px) rotateY(${a}deg) translateZ(${ringR}px)`;
    el.style.transform=base;
    carousel.appendChild(el); ringItems.push({el,b,base});
  }
}
let lifted=null;
function liftRing(item){
  if(lifted===item) return;
  if(lifted) lifted.el.style.transform=lifted.base;
  lifted=item;
  if(item){ item.el.style.transform=item.base+` translateY(${-28*S()}px)`; preview(item.b); }
}

/* ───────────── interaction ───────────── */
let mode='ring';
const stage=document.getElementById('stage');
let down=null, moved=0;
function bookAt(cx,cy){
  const hit=document.elementFromPoint(cx,cy)?.closest('.book');
  if(hit || mode!=='ring') return hit;
  // edge-on cards at the front of the ring are only a few px wide: give them a forgiving hit area
  let best=null, bestB=-1;
  for(const r of ringItems){ const b=r.el.getBoundingClientRect();
    if(cx>b.left-8&&cx<b.right+8&&cy>b.top&&cy<b.bottom&&b.bottom>bestB){best=r.el;bestB=b.bottom;} }
  return best;
}
stage.addEventListener('pointerdown',e=>{
  down={x:e.clientX}; moved=0; stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(down){
    const dx=e.clientX-down.x; down.x=e.clientX; moved+=Math.abs(dx);
    if(moved>6){ stage.classList.add('dragging'); if(mode==='shelf'&&selected){deselect();hideDetail();} }
    if(mode==='shelf') tx+=dx*1.2; else trot+=dx*.25;
    return;
  }
  hoverAt(e.clientX,e.clientY);
});
let lastPtr=null;
function hoverAt(cx,cy){
  lastPtr={cx,cy};
  if(detail.classList.contains('open')) return;
  const hit=bookAt(cx,cy);
  if(mode==='ring'){ liftRing(hit?ringItems.find(r=>r.el===hit):null); }
  else {
    for(const s of slots) if(s.slot.classList.contains('hover') && s.el!==hit) s.slot.classList.remove('hover');
    const s=hit&&slots.find(s=>s.el===hit);
    if(s){ s.slot.classList.add('hover'); preview(s.b); }
  }
}
stage.addEventListener('pointerleave',()=>{ lastPtr=null; liftRing(null); slots.forEach(s=>s.slot.classList.remove('hover')); });
stage.addEventListener('pointerup',e=>{
  stage.classList.remove('dragging');
  const wasClick = moved<6; down=null;
  if(!wasClick) return;
  const hit=bookAt(e.clientX,e.clientY);
  if(!hit){ deselect(); hideDetail(); return; }
  if(mode==='shelf'){ const s=slots.find(s=>s.el===hit); if(s) selectSlot(s); }
  else { const it=ringItems.find(r=>r.el===hit); if(it){ liftRing(it); showDetail(it.b); } }
});
addEventListener('wheel',e=>{
  if(detail.contains(e.target)) return;
  const d = Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  if(mode==='shelf'){ if(selected&&Math.abs(d)>4){deselect();hideDetail();} tx-=d; }
  else trot-=d*.08;
},{passive:true});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){deselect();hideDetail();}
  if(e.key==='ArrowRight'){ mode==='shelf'?tx-=160:trot-=10; }
  if(e.key==='ArrowLeft'){ mode==='shelf'?tx+=160:trot+=10; }
});

document.querySelectorAll('.pills button').forEach(btn=>btn.onclick=()=>{
  mode=btn.dataset.mode;
  document.querySelectorAll('.pills button').forEach(b=>b.classList.toggle('on',b===btn));
  document.getElementById('shelf').classList.toggle('off',mode!=='shelf');
  document.getElementById('ring').classList.toggle('off',mode!=='ring');
  document.getElementById('big').textContent = mode==='ring'?'Ring':'Shelf';
  document.getElementById('hint').textContent = mode==='shelf'?'拖曳或滾動 · 點書抽出來看':'拖曳或滾動旋轉 · 點書看詳情';
  liftRing(null); deselect(); hideDetail();
});

/* ───────────── loop ───────────── */
let last=performance.now(), frame=0;
function tick(now){
  const dt=Math.min(50,now-last); last=now; frame++;
  if(mode==='shelf'){
    if(!selected){
      while(tx>-setWidth){ tx-=setWidth; x-=setWidth; }
      while(tx<-setWidth*2){ tx+=setWidth; x+=setWidth; }
    }
    const nx = x+(tx-x)*.1; vel = nx-x; x=nx;
    track.style.transform=`translate3d(${x}px,0,0)`;
    const sway=Math.max(-14,Math.min(14,vel*.6));
    track.style.perspectiveOrigin=`${-x+innerWidth/2}px 40%`;
    for(const s of slots) if(s!==selected && !s.slot.classList.contains('leaving')) s.el.style.transform=`rotateZ(${s.lean}deg) rotateY(${-sway}deg)`;
  } else {
    const paused = down || detail.classList.contains('open') || lifted;
    if(!paused) trot -= dt*.005;
    rot += (trot-rot)*.08;
    carousel.style.transform=`rotateX(-22deg) rotateY(${rot}deg)`;
  }
  // books move under a still cursor: re-check hover a few times a second
  if(lastPtr && !down && frame%6===0) hoverAt(lastPtr.cx,lastPtr.cy);
  requestAnimationFrame(tick);
}
function build(){ buildShelf(); buildRing(); tx=x=-setWidth; }
build();
preview(books[0]);
let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{deselect();hideDetail();build();},200)});
requestAnimationFrame(tick);
</script>
</body>
